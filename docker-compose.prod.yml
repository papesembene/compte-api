services:
  app:
    build:
      context: .
      dockerfile: Dockerfile
    ports:
      - "10000:10000"
    environment:
      APP_NAME: "Compte API"
      APP_ENV: production
      APP_KEY: ${APP_KEY}  # Set this in Render environment variables
      APP_DEBUG: false
      APP_URL: ${APP_URL}  # e.g., https://your-app.onrender.com

      DB_CONNECTION: pgsql
      DB_HOST: ${DB_HOST}  # Render PostgreSQL host
      DB_PORT: 5432
      DB_DATABASE: ${DB_DATABASE}
      DB_USERNAME: ${DB_USERNAME}
      DB_PASSWORD: ${DB_PASSWORD}

      LOG_CHANNEL: stack
      LOG_DEPRECATIONS_CHANNEL: null
      LOG_LEVEL: error
    depends_on:
      - postgres  # If using internal DB, but for Render, use external