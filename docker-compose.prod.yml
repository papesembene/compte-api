services:
  # PostgreSQL for local testing
  postgres:
    image: postgres:15-alpine
    container_name: compte-api-postgres-prod
    environment:
      POSTGRES_DB: compte-api
      POSTGRES_USER: laravel
      POSTGRES_PASSWORD: secret
    volumes:
      - postgres_data_prod:/var/lib/postgresql/data
    ports:
      - "5434:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U laravel -d compte-api"]
      interval: 10s
      timeout: 5s
      retries: 5

  app:
    build:
      context: .
      dockerfile: Dockerfile
    ports:
      - "10000:10000"
    environment:
      APP_NAME: "Compte API"
      APP_ENV: production
      APP_KEY: base64:F14qXa06yAZ66ISu0cQiqKApvZU+Vdbm7ISXrr2ewyQ=
      APP_DEBUG: false
      APP_URL: ${APP_URL:-http://localhost:10000}

      DB_CONNECTION: pgsql
      DB_HOST: postgres
      DB_PORT: 5432
      DB_DATABASE: compte-api
      DB_USERNAME: laravel
      DB_PASSWORD: secret

      LOG_CHANNEL: stack
      LOG_DEPRECATIONS_CHANNEL: null
      LOG_LEVEL: error
    depends_on:
      postgres:
        condition: service_healthy

volumes:
  postgres_data_prod: